<VirtualHost *:80>
  ServerName spars.systemsdelight.com

  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"

  Alias /admin /var/www/spars-admin
  <Directory /var/www/spars-admin>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>

  RewriteEngine On
  RewriteCond %{REQUEST_URI} ^/admin
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule ^/admin(/.*)?$ /admin/index.html [L]

  Alias /collect /var/www/spars-collect
  <Directory /var/www/spars-collect>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>

  RewriteCond %{REQUEST_URI} ^/collect
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule ^/collect(/.*)?$ /collect/index.html [L]

  <FilesMatch "service-worker\.js$">
    Header set Cache-Control "no-cache"
  </FilesMatch>
  <FilesMatch "\.(js|css|png|jpg|jpeg|svg|webp|woff2)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
  </FilesMatch>

  ProxyPreserveHost On
  ProxyPass        /api http://127.0.0.1:3000/api
  ProxyPassReverse /api http://127.0.0.1:3000/api
</VirtualHost>
